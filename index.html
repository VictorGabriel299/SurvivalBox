// inputs & definitions

let logs=[]
for(const func of ["log","info","debug","warn","error"]){
  console[func]=(...args)=>{
    let txt=args.map(arg=>{
      if(typeof arg==="bigint")return arg+"n"
      if(typeof arg==="object"&&arg!==null){
        try{
          return JSON.stringify(arg,(key,value)=>
            typeof value==="bigint"?value+"n":value
          ,2)
        }catch{
          return String(arg)
        }
      }
      return String(arg)
    }).join(" ")
    let msg=`${func.toUpperCase()}: ${txt}`
    logs.push(msg)
    if(logs.length>5)logs.shift()
    if(func==="warn"||func==="error")alert(msg)
  }
}

/*
OPERATOR LIST:
+ -> add
- -> subtract
/ -> divide
* -> multiply
& -> arithmetic mean
! -> inversion (max possible - value)
? -> random (actual to value)
< -> min
> -> max
<> -> swap
# -> set (redundant)

REFERENCE (@):
@s -> self

@a+"prefix" -> all
@n+"prefix" -> nearest
@r+"prefix" -> random

prefixes:
"p"->player (@ap,@np,@rp)

VARIABLE ($):
*/

const validOpe=["+","-","*","/","%","&","!","?","<",">","<>","#"]
class Commands{
    static parser(txt){
      const args=[]
      let current=""
      let depth=0
      let quote=null
      for(let i=0;i<txt.length;i++){
        const char=txt[i]
        if(quote){
          current+=char
          if(char===quote&&txt[i-1]!=="\\")quote=null
          continue
        }
        if(char==='"'||char==="'"){
          quote=char
          current+=char
          continue
        }
        if(char==="{"||char==="["||char==="("){
          depth++
          current+=char
          continue
        }
        if(char==="}"||char==="]"||char===")"){
          depth--
          current+=char
          continue
        }
        if(/\s/.test(char)&&!depth){
          if(current){
            args.push(current)
            current=""
          }
          continue
        }
        current+=char
      }
      if(current)args.push(current)
      return args
    }
    
    static parseArgNum(num,base){
      if(num==="~")return base
      else if(num.startsWith("~")){
        const add=Number(num.replace("~",""))
        if(!Number.isNaN(add))return base+add
        return 0
      }
      else if(!Number.isNaN(Number(num)))return Number(num)
      return 0
    }
    
    static sendCommand(txt,options={}){
      const parsed=Commands.parser(txt)
      switch(parsed[0]){
        case "log":{
          if(parsed.length<2){
            console.warn("[COMMANDS] - Not Enough Arguments.")
            break
          }
         
          if(!["log","info","debug","warn","error","clear"].includes(parsed[1])){
            console.warn("[COMMANDS] - Invalid Operation.")
            break
          }
          Commands.log(parsed[1],parsed[2]??"")
          break
        }
        case "fillblock":{
          if(parsed.length<8){
            console.warn("[COMMANDS] - Not Enough Arguments.")
            break
          }
          const range=[{},{}]
          
          range[0].x=Commands.parseArgNum(parsed[1],options.pos?.x??0)
          range[0].y=Commands.parseArgNum(parsed[2],options.pos?.y??0)
          range[0].z=Commands.parseArgNum(parsed[3],options.pos?.z??0)
          
          range[1].x=Commands.parseArgNum(parsed[4],options.pos?.x??0)
          range[1].y=Commands.parseArgNum(parsed[5],options.pos?.y??0)
          range[1].z=Commands.parseArgNum(parsed[6],options.pos?.z??0)
          
          const ope=validOpe.includes(parsed[7])?parsed[7]:""
          const bIndex=ope?8:7
          if(!parsed[bIndex]){
            console.warn("[COMMANDS] - Not Enough Arguments.")
            break
          }
          let block={id:0}
          try{ block=JSON.parse(parsed[bIndex]) } catch(e){ console.warn("[COMMANDS] - Invalid Block Format:",e.message); break }
          
          Commands.fillBlock(range,block,ope)
          break
        }
        case "setblock":{
          if(parsed.length<5){
            console.warn("[COMMANDS] - Not Enough Arguments.")
            break
          }
          let pos={}
          pos.x=Commands.parseArgNum(parsed[1],options.pos?.x??0)
          pos.y=Commands.parseArgNum(parsed[2],options.pos?.y??0)
          pos.z=Commands.parseArgNum(parsed[3],options.pos?.z??0)
          
          const ope=validOpe.includes(parsed[4])?parsed[4]:""
          const bIndex=ope?5:4
          if(!parsed[bIndex]){
            console.warn("[COMMANDS] - Not Enough Arguments.")
            break
          }
          let block={id:0}
          try{ block=JSON.parse(parsed[bIndex]) } catch(e){ console.warn("[COMMANDS] - Invalid Block Format:",e.message); break }
          
          Commands.setBlock(pos,block,ope)
          break
        }
        default: console.warn("[COMMANDS] - Invalid Command Detected:",parsed[0])
      }
    }
    
    static log(type,msg=""){
      if(type==="clear")logs=[]
      else console[type](msg)
    }
    
    static setBlock(pos,block,ope=""){
       if(!ope)Block.set(pos,Block.unparse(block))
       else{
         const actBlock=Block.parse(Block.get(pos))
         const res={}
         for(const [key,value] of Object.entries(actBlock)){
           if(block[key]!=undefined){
             switch(ope){
               case "&": res[key]=clamp((value+block[key])>>1,0,127); break;
               case "+": res[key]=clamp(value+block[key],0,127); break;
               case "-": res[key]=clamp(value-block[key],0,127); break;
               case "*": res[key]=clamp(value*block[key],0,127); break;
               case "/": res[key]=clamp(value/block[key],0,127); break;
               case "%": res[key]=clamp(value%block[key],0,127); break;
               case "<": res[key]=clamp(Math.min(value,block[key]),0,127); break;
               case ">": res[key]=clamp(Math.max(value,block[key]),0,127); break;
               case "?": res[key]=clamp(sort(value,block[key]),0,127); break;
               case "!": res[key]=clamp(127-value,0,127); break;
               case "<>": res[key]=clamp(block[key],0,127); break;
               case "#": res[key]=clamp(block[key],0,127); break;
               default:res[key]=clamp(block[key],0,127); break;
             }
           } else res[key]=value
         }
         Block.set(pos,Block.unparse(res))
       }
    }
    
    static fillBlock(range,block,ope=""){
       for(let x=range[0].x; x<=range[1].x; x++){
         for(let y=range[0].y; y<=range[1].y; y++){
           for(let z=range[0].z; z<=range[1].z; z++){
             Commands.setBlock({x,y,z},block,ope)
           }
         }
       }
    }
    
    constructor(){}
}

let isTouching = false
let lastX = 0
let lastY = 0

let yaw = 0
let pitch = 0

document.addEventListener("touchstart",(e)=>{
  if(e.target.closest("#joystick"))return

  isTouching=true
  lastX=e.touches[0].clientX
  lastY=e.touches[0].clientY
})

document.addEventListener("touchmove", (e) => {
  if(e.target.closest("#joystick"))return
  if(!isTouching)return

  const touch = e.touches[0]

  let deltaX = touch.clientX - lastX
  let deltaY = touch.clientY - lastY

  lastX = touch.clientX
  lastY = touch.clientY

  const sens = 0.003

  yaw -= deltaX * sens
  pitch -= deltaY * sens

  pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch))

  camera.rotation.order = "YXZ"
  camera.rotation.y = yaw
  camera.rotation.x = pitch
})

document.addEventListener("touchend", () => {
  isTouching = false
})

const joystickRadius=40

joystickBase.ontouchstart=joystickBase.ontouchmove=(e)=>{
    const touch=e.touches[0]
    const rect=joystickBase.getBoundingClientRect()

    let x=touch.clientX-rect.left-rect.width/2
    let y=touch.clientY-rect.top-rect.height/2

    const dist=Math.hypot(x,y)

    if(dist>joystickRadius){
        x*=joystickRadius/dist
        y*=joystickRadius/dist
    }

    joystick.x=x/joystickRadius
    joystick.y=y/joystickRadius

    joystickStick.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`
}

joystickBase.ontouchend=()=>{
    joystick.x=0
    joystick.y=0

    joystickStick.style.transform="translate(-50%,-50%)"
}

const blockGeometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize)
const itemGeometry=new THREE.PlaneGeometry(blockSize, blockSize)

async function loadGeometries(){
  let currentFile = ""
  try{
    const user = "VictorGabriel299"
    const repo = "SurvivalBox"
    const branch = "master"

    const treeRes = await fetch(
      `https://data.jsdelivr.com/v1/package/gh/${user}/${repo}@${branch}/tree`
    )

    if (!treeRes.ok) {
      console.error("[GEOMETRIES] - Failed to fetch file list", treeRes.status)
      return
    }

    const treeData = await treeRes.json()
    const geoDir = treeData.files.find(
      item => item.name === "geometries" && item.type === "directory"
    )
    if (!geoDir || !Array.isArray(geoDir.files)) return
  
    const loader=new OBJLoader()
    const results=await Promise.all(
      geoDir.files.filter(file=>file.name.endsWith(".obj")).map(async file=>{
        currentFile=file.name
        const fileUrl=`https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/geometries/${file.name}`
        const res=await fetch(fileUrl)
        const obj=loader.parse(await res.text())
        const geo=obj.children[0].geometry
        geo.scale(blockSize/2,blockSize/2,blockSize/2)
        return [
          file.name.replace(".obj",""),
          geo
        ]
      })
    )
    geometries=Object.fromEntries(results)
    geometries.block=blockGeometry
    geometriesLoaded=true
  } catch (e) {
    console.error("[GEOMETRIES] - ", e, " in ", currentFile)
  }
}

let blockJsons = [];
async function loadBlocks(){
  let currentFile = ""
  try{
    const user = "VictorGabriel299"

    const treeRes = await fetch(
      `https://data.jsdelivr.com/v1/package/gh/${user}/${repo}@${branch}/tree`

    if (!treeRes.ok) {
      console.error("[BLOCKS] - Failed to fetch file list", treeRes.status)

    const treeData = await treeRes.json()
    const blocksDir = treeData.files.find(
      item => item.name === "blocks" && item.type === "directory"
    )
    if (!blocksDir || !Array.isArray(blocksDir.files)) {
      console.error("[BLOCKS] - Invalid file list", treeData)
      return
    }
    
    const jsonFiles = blocksDir.files.filter(file => file.name.endsWith(".json"))
    for (const file of jsonFiles) {
      currentFile=file.name
      const fileUrl=`https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/blocks/${file.name}`
      const response = await fetch(fileUrl)
      if (!response.ok) {
        console.warn("[BLOCKS] - Failed to fetch file", file.name, response.status)
        continue
      }
      const text = await response.text()
      const json = JSON.parse(text)
      if (!json.definitions) {
        console.warn("[BLOCKS] - Missing definitions", file.name, json)
        continue
      }
      if (!(json.definitions.id>0)) {
        console.warn("[BLOCKS] - Invalid ID", file.name, json)
        continue
      }
      const id = Math.floor(json.definitions.id)
      json.definitions.id=file.name.replace(".json", "").replaceAll("_"," ")
      blockJsons[id]=json
    }
    if(!blockJsons.length)console.error("[BLOCKS] - No valid blocks were loaded")
  } catch (e) {
    console.error("[BLOCKS] - ", e, " in ", currentFile)
  }
}


/* biomes */
let biomes=[]
const unparseBlock=(obj)=>{
  if(!obj||!obj.id)return 0n
  let n=0n
  
  n |= BigInt(obj.id & 0x3FFF) << 34n
  n |= BigInt((obj.texture ?? 0) & 0x3F) << 28n
  n |= BigInt((obj.facing ?? 0) & 0x7) << 25n
  
  n |= BigInt((obj.b1 ?? 0) & 0x1) << 24n
  n |= BigInt((obj.b2 ?? 0) & 0x1) << 23n
  n |= BigInt((obj.b3 ?? 0) & 0x1) << 22n
  n |= BigInt((obj.b4 ?? 0) & 0x1) << 21n
  
  n |= BigInt((obj.v1 ?? 0) & 0x7F) << 14n
  n |= BigInt((obj.v2 ?? 0) & 0x7F) << 7n
  n |= BigInt((obj.v3 ?? 0) & 0x7F)
  
  return n
}
async function loadBiomes(){
  let currentFile = ""
  try{
    const user = "VictorGabriel299"
    const repo = "SurvivalBox"
    const branch = "master"

    const treeRes = await fetch(
      `https://data.jsdelivr.com/v1/package/gh/${user}/${repo}@${branch}/tree`
    )
    if (!treeRes.ok) {
      console.error("[BIOMES] - Failed to fetch file list", treeRes.status)
      return
    }

    const treeData = await treeRes.json()
    const biomesDir = treeData.files.find(
      item => item.name === "biomes" && item.type === "directory"
    )
    if (!biomesDir || !Array.isArray(biomesDir.files)) {
      console.error("[BIOMES] - Invalid file list", treeData)
      return
    }

    const jsonFiles = biomesDir.files.filter(file => file.name.endsWith(".json"))
    for (const file of jsonFiles) {
      currentFile = file.name
      const fileUrl = `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/terrain/${file.name}`
      const response = await fetch(fileUrl)
      if (!response.ok) {
        console.warn("[BIOMES] - Failed to fetch file", file.name, response.status)
        continue
      }
      
      //if(file.name==="desert.json"|| file.name==="jungle.json")continue
      
      const text = await response.text()
      const json = JSON.parse(text)
      if (!json.id) {
        console.warn("[BIOMES] - Invalid ID", file.name, json)
        continue
      }

      if (!json.layers) {
        console.warn("[BIOMES] - Missing Biome Layers", file.name, json)
        continue
      }

      if(file.name==="default.json")biomes.unshift(json)
      else biomes.push(json)
    }

    for(let i=0; i<biomes.length; i++){
      const biome=biomes[i]
      if(i){
        const temp1=clamp(0,255,Math.floor((biome.tempRange[0]??0)*255))
        const temp2=clamp(0,255,Math.floor((biome.tempRange[1]??0)*255))
        biome.tempRange=[Math.min(temp1,temp2),Math.max(temp1,temp2)]
        
        const hum1=clamp(0,255,Math.floor((biome.humRange[0]??0)*255))
        const hum2=clamp(0,255,Math.floor((biome.humRange[1]??0)*255))
        biome.humRange=[Math.min(hum1,hum2),Math.max(hum1,hum2)]
      }
      const layers=biome?.layers

      if(!layers){
        biomes.splice(i,1)
        i--
        continue
      }

      for(const layerName in layers){
        const layer=layers[layerName]

        if(Array.isArray(layer)){
          const arr=[]

          for(let j=0; j<layer.length; j++){
            const entry=layer[j]

            arr.push({
              weight:entry.weight??1,
              raw:unparseBlock(entry)
            })
          }

          biome.layers[layerName]=arr
        } else biome.layers[layerName]={
          raw:unparseBlock(layer)
        }
      }
    }
  } catch (e) {
    console.error("[BIOMES] - ", e.message, " in ", currentFile)
  }
}

// essentials
function clamp(min,max,val){
    return Math.min(max, Math.max(min,val))
}

function sort(min,max,precise=false,precision=2){
    const rand=Math.floor(Math.random()*(max+1-min))+min
    if(!precise)return Math.floor(rand)
    else{
      const factor=10**precision
      return Math.round(rand*factor)/factor
    }
}

function approachZero(n,step){
  if(n>0)return Math.max(0,n-step)
  if(n<0)return Math.min(0,n+step)
  return 0
}

function noise(x,z){
      const ix = Math.floor(x)
      const iz = Math.floor(z)

      const fx = x - ix
      const fz = z - iz

      const ux = fx*fx*(3-2*fx)
      const uz = fz*fz*(3-2*fz)

      const a = hash(ix,iz)/4294967295
      const b = hash(ix+1,iz)/4294967295
      const c = hash(ix,iz+1)/4294967295
      const d = hash(ix+1,iz+1)/4294967295

      return a + 
        (b-a)*ux +
        (c-a)*uz +
        (a-b-c+d)*ux*uz
}

const seed = (Math.random() * 1e9) | 0
const seedHash=seed*1013904223
function hash(x,z,y=0){
  let h = Math.imul(x,374761393)
  h += Math.imul(z,668265263)
  h += Math.imul(y,1442695)
  h += seedHash

  h = Math.imul(h ^ (h>>>13),2246822519)
  h = Math.imul(h ^ (h>>>16),3266489917)

  return h>>>0
}

function fbm(x,z) {
  return noise(x,z)*0.75 +
         noise(x*2,z*2)*0.25
}

const getHeight=(()=>{
  if(!heightDeform)return (x,z)=>baseHeight|0
  const d40=40*heightDeform
  const d80=80*heightDeform
  return (x,z)=>{
    const n1=fbm(x*0.01,z*0.01)
    const n2=noise(x*0.02,z*0.02)
    
    const m=n2*n2
    return (baseHeight+n1*d40+m*d80)|0
  }
})()

function disposeObject3D(obj) {
  obj.traverse(child => {
    if (child.geometry) child.geometry.dispose()

    if (child.material) {
      if (Array.isArray(child.material)) {
        child.material.forEach(m => m.dispose())
      } else {
        child.material.dispose()
      }
    }
  })
}

function buildGeometry(data) {
  const geometry = new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(data.vertices, 3)
  );

  if (data.uv && data.uv.length) {
    geometry.setAttribute(
      "uv",
      new THREE.Float32BufferAttribute(data.uv, 2)
    );
  }

  if (data.normals && data.normals.length) {
    geometry.setAttribute(
      "normal",
      new THREE.Float32BufferAttribute(data.normals, 3)
    );
  }

  if (data.indices && data.indices.length) {
    geometry.setIndex(data.indices);
  }

  return geometry;
}

function serializeGeometriesForWorker(){

  for(const [name,geo] of Object.entries(geometries)){

    const uv=geo.getAttribute("uv")

        :null,

      normal:normal
        ?new Float32Array(normal.array)
        :null,

      uv:uv
        ?new Float32Array(uv.array)
        :null,

      index:index
        ?(
          index.array instanceof Uint32Array
            ?new Uint32Array(index.array)
            :new Uint16Array(index.array)
        )
        :null,

      vertexCount:position?.count??0
    }
  }

  return result
}

function getTargetBlock(maxDist = 5) {
  const origin = camera.position.clone()
  const dir = new THREE.Vector3()
  camera.getWorldDirection(dir)

  let x = Math.floor(origin.x / blockSize)
  let y = Math.floor(origin.y / blockSize)
  let z = Math.floor(origin.z / blockSize)

  const stepX = Math.sign(dir.x)
  const stepY = Math.sign(dir.y)
  const stepZ = Math.sign(dir.z)

  const tDeltaX = dir.x !== 0 ? Math.abs(blockSize / dir.x) : Infinity
  const tDeltaY = dir.y !== 0 ? Math.abs(blockSize / dir.y) : Infinity
  const tDeltaZ = dir.z !== 0 ? Math.abs(blockSize / dir.z) : Infinity

  const nextBoundaryX = (x + (stepX > 0 ? 1 : 0)) * blockSize
  const nextBoundaryY = (y + (stepY > 0 ? 1 : 0)) * blockSize
  const nextBoundaryZ = (z + (stepZ > 0 ? 1 : 0)) * blockSize

  let tMaxX = dir.x !== 0 ? (nextBoundaryX - origin.x) / dir.x : Infinity
  let tMaxY = dir.y !== 0 ? (nextBoundaryY - origin.y) / dir.y : Infinity
  let tMaxZ = dir.z !== 0 ? (nextBoundaryZ - origin.z) / dir.z : Infinity

  const maxT = maxDist * blockSize

  let face = null

  while (true) {
    const block = Block.get({x,y,z})
    if (block && block !== 0) {
      return {
        pos: { x, y, z },
        face
      }
    }

    if (tMaxX < tMaxY) {
      if (tMaxX < tMaxZ) {
        x += stepX
        face = { x: -stepX, y: 0, z: 0 }
        if (tMaxX > maxT) break
        tMaxX += tDeltaX
      } else {
        z += stepZ
        face = { x: 0, y: 0, z: -stepZ }
        if (tMaxZ > maxT) break
        tMaxZ += tDeltaZ
      }
    } else {
      if (tMaxY < tMaxZ) {
        y += stepY
        face = { x: 0, y: -stepY, z: 0 }
        if (tMaxY > maxT) break
        tMaxY += tDeltaY
      } else {
        z += stepZ
        face = { x: 0, y: 0, z: -stepZ }
        if (tMaxZ > maxT) break
        tMaxZ += tDeltaZ
      }
    }
  }

  return null
}

const transparentBlocksID=[ 4,6 ]

class Block{
   static parse(data){
      const n=BigInt(data)
      return{
         id: Number((n >> 34n) & 0x3FFFn),
         texture: Number((n >> 28n) & 0x3Fn),
         facing: Number((n >> 25n) & 0x7n),

         b1: Number((n >> 24n) & 0x1n),
         b2: Number((n >> 23n) & 0x1n),
         b3: Number((n >> 22n) & 0x1n),
         b4: Number((n >> 21n) & 0x1n),

         v1: Number((n >> 14n) & 0x7Fn),
         v2: Number((n >> 7n) & 0x7Fn),
         v3: Number(n & 0x7Fn)
      }
   }

   static unparse(obj){
      if(!obj||!obj.id)return 0n

      let n=0n
      n |= BigInt(obj.id & 0x3FFF) << 34n
      n |= BigInt((obj.texture ?? 0) & 0x3F) << 28n
      n |= BigInt((obj.facing ?? 0) & 0x7) << 25n

      n |= BigInt((obj.b1 ?? 0) & 0x1) << 24n
      n |= BigInt((obj.b2 ?? 0) & 0x1) << 23n
      n |= BigInt((obj.b3 ?? 0) & 0x1) << 22n
      n |= BigInt((obj.b4 ?? 0) & 0x1) << 21n

      n |= BigInt((obj.v1 ?? 0) & 0x7F) << 14n
      n |= BigInt((obj.v2 ?? 0) & 0x7F) << 7n
      n |= BigInt((obj.v3 ?? 0) & 0x7F)

      return n
   }

   static get(pos,key=null){
      const chunk=key??chunks.get((pos.x>>4)+","+(pos.z>>4))
      if(!chunk||pos.y<0||pos.y>=worldHeight)return 0n

      const x=pos.x&15
      const z=pos.z&15
      const index=(pos.y<<8)+(z<<4)+x

      return chunk.blocks[index]||0n
   }

   static set(pos,data,key=null){
      const chunkKey=(pos.x>>4)+","+(pos.z>>4)
      const chunk=key??chunks.get(chunkKey)
      
      if(pos.y<0||pos.y>=worldHeight)return
      
      const x=pos.x&15
      const z=pos.z&15
      const index=(pos.y<<8)+(z<<4)+x

      if(chunk){
        chunk.blocks[index]=typeof data==="bigint"?data:BigInt(data??0)
        return
      }
      const newChunk=nChunk.get(chunkKey)
      if(newChunk){
        newChunk.set(index,typeof data==="bigint"?data:BigInt(data??0))
        return
      }
      
      const blocks = new Map()
      blocks.set(index,typeof data==="bigint"?data:BigInt(data??0))
      nChunk.set(chunkKey,blocks)
   }
   
   static isVisible(pos){
    return(
      transparentBlocksID[Number((Block.get({x:pos.x+1,y:pos.y,z:pos.z}) >> 34n) & 0x3FFFn)] ||
      transparentBlocksID[Number((Block.get({x:pos.x-1,y:pos.y,z:pos.z}) >> 34n) & 0x3FFFn)] ||
      transparentBlocksID[Number((Block.get({x:pos.x,y:pos.y+1,z:pos.z}) >> 34n) & 0x3FFFn)] ||
      transparentBlocksID[Number((Block.get({x:pos.x,y:pos.y-1,z:pos.z}) >> 34n) & 0x3FFFn)] ||
      transparentBlocksID[Number((Block.get({x:pos.x,y:pos.y,z:pos.z+1}) >> 34n) & 0x3FFFn)] ||
      transparentBlocksID[Number((Block.get({x:pos.x,y:pos.y,z:pos.z-1}) >> 34n) & 0x3FFFn)]
    )
  }

   static evaluateCondition(condition,block,pos){
      try{
         const climate=Biome.getClim(pos)
         let item=Item.parse(item.item,item.type)
         const context={
            ...block,
            ...climate,

         if(condition.includes("it")){

         }

         const fn=new Function(
            ...Object.keys(context),
            `return ${condition}`
         )

         return fn(...Object.values(context))
      }catch(e){
         return false
      }
   }

   static getJson(data,options={}){
      const block=options.parsed?data:Block.parse(data)
      const base=blockJsons[block.id]
      if(!base)return

      let result={
         definitions:{...(base.definitions||{})},
         behavior:{...(base.behavior||{})},
         triggers:{...(base.triggers||{})}
      }

      if(base.states){

            if(Block.evaluateCondition(state.conditions,block,options.pos??{})){
               if(state.definitions)Object.assign(result.definitions,state.definitions)
               if(state.behavior)Object.assign(result.behavior,state.behavior)
            }
         })

   static getTarget(maxDist=5){
      const origin=camera.position.clone()
      const dir=new THREE.Vector3()
      camera.getWorldDirection(dir)

      const pos={x:Math.floor(origin.x/blockSize),y:Math.floor(origin.y/blockSize),z:Math.floor(origin.z/blockSize)}

      const step={x:Math.sign(dir.x),y:Math.sign(dir.y),z:Math.sign(dir.z)}

      const tDelta={x:dir.x!==0?Math.abs(blockSize/dir.x):Infinity,y:dir.y!==0?Math.abs(blockSize/dir.y):Infinity,z:dir.z!==0?Math.abs(blockSize/dir.z):Infinity}

      const nextBoundary={x:(pos.x+(step.x>0?1:0))*blockSize,y:(pos.y+(step.y>0?1:0))*blockSize,z:(pos.z+(step.z>0?1:0))*blockSize}

      let tMax={x:dir.x!==0?(nextBoundary.x-origin.x)/dir.x:Infinity,y:dir.y!==0?(nextBoundary.y-origin.y)/dir.y:Infinity,z:dir.z!==0?(nextBoundary.z-origin.z)/dir.z:Infinity}

      const maxT=maxDist*blockSize

      let face=null
      while(true){
         const block=Block.get(pos)
         if(block&&block!==0n)return{
            pos:{...pos},
            face
         }

         if(tMax.x<tMax.y){
            if(tMax.x<tMax.z){
               pos.x+=step.x
               face={x:-step.x,y:0,z:0}
               if(tMax.x>maxT)break
               tMax.x+=tDelta.x
            }else{
               pos.z+=step.z
               face={x:0,y:0,z:-step.z}
               if(tMax.z>maxT)break
               tMax.z+=tDelta.z
            }
         }else{
            if(tMax.y<tMax.z){
               pos.y+=step.y
               face={x:0,y:-step.y,z:0}
               if(tMax.y>maxT)break
               tMax.y+=tDelta.y
            }else{
               pos.z+=step.z
               face={x:0,y:0,z:-step.z}
               if(tMax.z>maxT)break
               tMax.z+=tDelta.z
            }
         }
      }
   }
   
   constructor(){}
}

class Biome{
  static getClim(pos){
    const cx=pos.x>>4
    const cz=pos.z>>4
    
    const lx=pos.x&15
    const lz=pos.z&15
    
    const chunk=chunks.get(cx+","+cz)
    if(!chunk)return null
    const i=(lz<<4)+lx
    return{
      temp:chunk.temp[i],
      hum:chunk.hum[i]
    }
  }
  
  static get(clim){
    let possi=[]
    for(let i=1; i<biomes.length; i++){
      const biome=biomes[i]
      
      const humRange=biome?.humRange
      if(clim.hum<(humRange?.[0]??0)||clim.hum>(humRange?.[1]??255))continue
      
      const tempRange=biome?.tempRange
      if(clim.temp<(tempRange?.[0]??0)||clim.temp>(tempRange?.[1]??255))continue
      
      possi.push({index:i,pri:biome.priority??0})
    }
    
    possi.sort((a,b)=>a.pri-b.pri)
    if(possi[0])return biomes[possi[0].index]
    else return biomes[0]
  }
  
  static pickLayer(layer,pos){
    if(!layer)return 0n
    if(!Array.isArray(layer))return layer.raw??0n

    let total=0
    for(let i=0; i<layer.length; i++)total+=layer[i].weight

    let r=hash(pos.x,pos.z,pos.y)%total

    for(let i=0; i<layer.length; i++){
      r-=layer[i].weight
      if(r<0)return layer[i].raw
    }

    return layer[layer.length-1].raw
  }
  
  constructor(){}
}

        if(this.player)this.player.update(delta)
        
        for(let c=0; c<this.creatures.length; c++){
          this.creatures[c].update(delta)
        }
        
        for(let i=0; i<this.items.length; i++){
          this.items[i].update(delta)
        }
        
        for(let c=0; c<this.collapsedBlocks.length; c++){
          this.collapsedBlocks[c].update(delta)
        }
        this.blockPhysics()
    }
    
    removeElement(element,arr){
      const array=this[arr]??[]
      
      if(element.mesh)scene.remove(element.mesh)

      let geometry=null
      if(type==="block"){
        const json=Block.getJson(data,pos)
        material=blockMaterials[json?.definitions.textures[Block.parse(data)?.texture??0]] 
        geometry=geometries[json?.definitions.geometry??"block"]?.clone()
      } else{
         const parsed=Item.parse(data,type)
         if(!parsed)return
         
         const sprite=itemSprites[type]?.[parsed.id]
         material = new THREE.MeshLambertMaterial({ map:sprite, transparent: true, side:THREE.DoubleSide })
         geometry=itemGeometry.clone()
      }
      
      if(!material||!geometry)return
      
      geometry.scale(0.375,0.375,0.375)
      const mesh=new THREE.Mesh(geometry, material)
      const spawnPos={ x:pos.x*blockSize+blockSize/2, y:pos.y*blockSize+blockSize/2, z:pos.z*blockSize+blockSize/2 }
      
      
      const obj=new Item(this,spawnPos,mesh,type,data,{ ...options })
      this.items.push(obj)
   }
   

   blockPhysics() {
      if (instableBlocks.size === 0) return;

      let pos = {};
      let nOffsets = [];

      for (const key of instableBlocks) {
         const [x, y, z] = key.split(",").map(Number);

         pos = { x, y, z };

         nOffsets = [
            { x: x + 1, y, z },
            { x: x - 1, y, z },
            { x, y: y + 1, z },
            { x, y: y - 1, z },
            { x, y, z: z + 1 },
            { x, y, z: z - 1 }
         ];

         const block = Block.getJson(Block.get(pos), { pos });

         if (!block) {
            instableBlocks.delete(key);
            continue;
         }

         const structure = block.behavior.structure;

         if (!structure) {
            BlockInteractions.collapse(this, pos, key);
            continue;
         }

         const below = Block.get({ x, y: y - 1, z });

         if (below) {
            instableBlocks.delete(key);

            const fMat = structure.floor;

            if (fMat && !fMat.includes(Number((below >> 34n) & 0x3FFFn))) {
               BlockInteractions.collapse(this, pos);
            }

            if (structure.onlyVertical) {
               BlockInteractions.collapse(this, pos);
            }

            continue;
         }

         const neighbors = [];

         for (const nPos of nOffsets) {
            if (instableBlocks.has(`${nPos.x},${nPos.y},${nPos.z}`)) {
               neighbors.push(0);
               continue;
            }

            const block = Block.get(nPos);

            neighbors.push(
               Block.getJson(block, { pos: nPos })?.behavior.structure ?? null
            );
         }

         const totalSupport = neighbors.reduce((sum, n) => {
            if (!n || n.support === false) return sum;

            return sum + (Math.abs(gravity * (n.mass ?? 1) * (n.factor ?? 0.75)) || 0);
         }, 0);

         const weight = Math.abs((structure.mass ?? 1) * gravity);

         if (totalSupport <= weight) {
            BlockInteractions.collapse(this, pos);
         }
      }
   }
}

const lWorld=new World()

class Dynamic {
    constructor(pos,options={}){
        this.mesh=options.mesh??null
        if(this.mesh)scene.add(this.mesh)
        this.prev={ ...pos }
        this.pos={ ...pos }
        this.vel={ x:options.vx??0, y:options.vy??0, z:options.vz??0 }
        this.inputVel={x:0,y:0,z:0}
        this.acc={ x:options.ax??0, y:options.ay??gravity, z:options.az??0 }
        this.onGround=false
        this.friction=0.1
    }
    setPos(pos,ope=""){
       for(const axis of ["x","y","z"]){
          if(pos[axis]==null)continue
          switch(ope){
            case "+": this.pos[axis]+=pos[axis]; break
            case "-": this.pos[axis]-=pos[axis]; break
            case "*": this.pos[axis]*=pos[axis]; break
            case "/": this.pos[axis]/=pos[axis]; break
            default: this.pos[axis]=pos[axis]
          }
       }
       this.mesh?.position.set(this.pos.x,this.pos.y,this.pos.z)
    }
    setVel(vel,ope="",input=false){
       if(input){
          for(const axis of ["x","y","z"]){
             if(vel[axis]==null)continue
             switch(ope){
               case "+": this.inputVel[axis]+=vel[axis]; break
               case "-": this.inputVel[axis]-=vel[axis]; break
               case "*": this.inputVel[axis]*=vel[axis]; break
               case "/": this.inputVel[axis]/=vel[axis]; break
               default: this.inputVel[axis]=vel[axis]
             }
          }
       } else{
          for(const axis of ["x","y","z"]){
             if(vel[axis]==null)continue
             switch(ope){
               case "+": this.vel[axis]+=vel[axis]; break
               case "-": this.vel[axis]-=vel[axis]; break
               case "*": this.vel[axis]*=vel[axis]; break
               case "/": this.vel[axis]/=vel[axis]; break
               default: this.vel[axis]=vel[axis]
             }
          }
       }
    }
    setAcc(acc,ope=""){
       for(const axis of ["x","y","z"]){
          if(acc[axis]==null)continue
          switch(ope){
            case "+": this.acc[axis]+=acc[axis]; break
            case "-": this.acc[axis]-=acc[axis]; break
            case "*": this.acc[axis]*=acc[axis]; break
            case "/": this.acc[axis]/=acc[axis]; break
            default: this.acc[axis]=acc[axis]
          }
       }
    }
    move(delta=1){
      const decay=Math.pow(1-this.friction,delta)
      for(const axis of ["x","y","z"]){
         this.vel[axis]+=this.acc[axis]*delta
         if(axis!=="y")this.vel[axis]*=decay
         if(Math.abs(this.vel[axis])<0.01)this.vel[axis]=0
         
         this.inputVel[axis]*=decay
         if(Math.abs(this.inputVel[axis])<0.01)this.inputVel[axis]=0
         
         this.pos[axis]+=(this.vel[axis]+this.inputVel[axis])*delta
      }
      
      this.mesh?.position.set(this.pos.x,this.pos.y,this.pos.z)
    }
    updatePrev(){
       this.prev={ ...this.pos }
    }
    blockCollision(dims){
       this.onGround=false
       
      const baseStart={ x:Math.floor(this.prev.x/blockSize), y:Math.floor(this.prev.y/blockSize), z:Math.floor(this.prev.z/blockSize) }
       const blockLoc={ x:this.prev.x/blockSize-baseStart.x, y:this.prev.y/blockSize-baseStart.y, z:this.prev.z/blockSize-baseStart.z }
       const dist={ x:Math.abs(blockLoc.x-0.5), y:Math.abs(blockLoc.y-0.5), z:Math.abs(blockLoc.z-0.5) }
       
       const axisDims={x:"w",y:"h",z:"d"}
       const result={pos:{},elast:{},input:{}}
       
       for(const axis of ["x","z","y"]){
          const ds=this.pos[axis]-this.prev[axis]
          if(!ds)continue
          const incre=Math.sign(ds)
          
          const otherAxis=["x","z","y"].filter(a=>a!==axis)
          const size=dims[axisDims[axis]]*-incre/2
          
          const start=Math.floor((this.prev[axis]+size)/blockSize)
          const end=Math.floor((this.pos[axis]-size)/blockSize)
          
          for(let i=start; i!==end+incre; i+=incre){
            const pos={x:baseStart.x,y:baseStart.y,z:baseStart.z}
            
            switch(axis){
              case "x": pos.x=i; break;
              case "y": pos.y=i; break;
              case "z": pos.z=i; break;
            }
            
            const block=Block.get(pos)
            if(!block)continue
            
            const json=Block.getJson(block,{pos})
            const box=json.definitions.box
            const offset=box?.offset
            
            const d1=axisDims[otherAxis[0]]
            const d2=axisDims[otherAxis[1]]
            const d3=axisDims[axis]
            
            const b1=box?.[d1]??blockSize
            const b2=box?.[d2]??blockSize
            const b3=box?.[d3]??blockSize
            if(!b1||!b2)continue
            
            const center1=0.5+(offset?.[otherAxis[0]]??0)
            const dist1=Math.abs(blockLoc[otherAxis[0]]+dims[d1]*-incre/(2*blockSize)-center1)
           if(dist1>b1/2)continue
           
           const center2=0.5+(offset?.[otherAxis[1]]??0)
            const dist2=Math.abs(blockLoc[otherAxis[1]]+dims[d2]*-incre/(2*blockSize)-center2)
           if(dist2>b2/2)continue
            
            const blockPos=pos[axis]*blockSize+blockSize/2
            
            result.pos[axis]=blockPos+b3*-incre/2+size
            result.elast[axis]=-(json.behavior.surface?.elasticity??0)
            result.input[axis]=0
            if(axis==="y"&&incre<0){
              this.onGround=true
              this.friction=json.behavior.surface?.friction??0.8
            } else this.friction=0.1
            this.onCollide(result.pos,axis)
            result.success=true
            break
          }
       }
       
       this.setPos(result.pos)
       this.setVel(result.elast,"*")
       this.setVel(result.input,"",true)
    }
    collide(dims,options={}){
     
      this.blockCollision(dims)
      
      if(!options.player&&!options.ignorePlayer){
         const objCol={
           pos:{ ...this.pos },
           dims
         }
         const playerCol={
            pos:{ ...player.pos },
            dims:Player.dims,
            vel:{ ...player.vel },
            prev:{ ...player.prev }
         }
         
         const collision=new Collision(objCol, playerCol).collision()
         if(collision?.pos){
            for(const axis of ["x","y","z"]){
               if(collision.pos[axis])player.pos[axis]=collision.pos[axis]
            }
         }
         
         if(collision?.sucess)this.onCollideCreature(collision?.pos,"player")
      }
   }
   onCollide(pos,axis,options={}){}
   onCollideCreature(pos,entity,options={}){}
}

class Player extends Creature {
    static dims={ w:16*playerScale, h:56*playerScale, d:16*playerScale }
    constructor(world,pos){
        super(world,0,pos,{})
        world.player=this
        this.world=world
        this.facing="north"
        this.dir={x:0,z:1}
        this.side={x:1,z:0}
    }
    input(){
      const acc=16
      const front={ x:this.dir.x*acc, z:this.dir.z*acc }
      const side={ x:this.side.x*acc, z:this.side.z*acc }
      
      let vel={
         x:front.x*joystick.y+side.x*joystick.x,
         z:front.z*joystick.y+side.z*joystick.x
      }
      
      const maxSpeedSqr=64**2
      const speedSqr=vel.x**2+vel.z**2
      
      if(speedSqr>maxSpeedSqr){
         const scale=Math.sqrt(maxSpeedSqr/speedSqr)
         vel.x*=scale
         vel.z*=scale
      }
      
      const targetBlock=Block?.getTarget()
      if(targetBlock){
         const {pos,face}=targetBlock
         if(pos){
            const parsed=Block.parse(Block.get(pos)??0)
            if(parsed){
               if(keys.destroy)BlockInteractions.destroy(this.world,pos,parsed)
               else if(keys.build)BlockInteractions.build(this.world,pos,face)
            }
         }
      }
           
      this.setVel(vel,"+",true)
      if(keys.jump&&this.onGround)this.setVel({y:500},"+")
    }
    update(delta=1){
        this.dir={ x:Math.sin(yaw), z:Math.cos(yaw) }
        this.side={ x:Math.sin(yaw+Math.PI/2), z:Math.cos(yaw+Math.PI/2) }
        
        if(Math.abs(this.dir.x)>Math.abs(this.dir.z)) this.facing=this.dir.x>0?"east":"west"
        else this.facing=this.dir.z>0?"south":"north"
        
        camera.position.set(this.pos.x, this.pos.y+Player.dims.h/2, this.pos.z)
        
        this.input()
        
        this.updatePrev()
        this.move(delta)
        this.collide(Player.dims,{ player:true })
    }
}

class Item extends Dynamic {
    static dims={ w:blockSize/4,h:blockSize/4,d:blockSize/4 }
    static unparse(data,type){
       let n = 0n
       if(type==="item"){
            n |= BigInt(data.id & 0xFFFF) << 16n
            n |= BigInt(data.amount??0 & 0x3) << 14n
            n |= BigInt((data.mass || 1) & 0x3FF) << 4n
            n |= BigInt((data.size ?? 0) & 0x3) << 2n
            n |= BigInt((data.rot ?? 0) & 0x3)
       } else if(type==="tool"){
            n |= BigInt(data.id & 0xFFFF) << 26n
            n |= BigInt(data.class & 0xF) << 22n
            n |= BigInt(data.material & 0x7) << 19n
            n |= BigInt((data.mass || 1) & 0x7) << 16n
            n |= BigInt((data.durability || 1) & 0x7FF) << 5n
            n |= BigInt((data.damage || 1) & 0x1F)
       } else if(type==="food"){
            n |= BigInt(data.id & 0xFFFF) << 23n
            n |= BigInt(data.amount & 0x3) << 21n
            n |= BigInt((data.mass || 1) & 0x3FF) << 11n
            n |= BigInt((data.size ?? 0) & 0x3) << 9n
            n |= BigInt((data.rot ?? 0) & 0x3) << 7n
            n |= BigInt(data.saturation & 0x7) << 4n
            n |= BigInt(data.hunger & 0x1F)
       }
       else if(type==="block")n=Block.unparse(data)
       return n
    }
    static parse(data,type){
       let n = BigInt(data)
       if(type==="item")return{
            id: Number((n >> 16n) & 0xFFFFn),
            amount: Number((n >> 14n) & 0x3n),
            mass: Number((n >> 4n) & 0x3FFn),
            size: Number((n >> 2n) & 0x3n),
            rot: Number(n & 0x3n)
       }
       else if(type==="tool")return{
           id: Number((n >> 26n) & 0xFFFFn),
           class: Number((n >> 22n) & 0xFn),
           material: Number((n >> 19n) & 0x7n),
           mass: Number((n >> 16n) & 0x7n),
           durability: Number((n >> 5n) & 0x7FFn),
           damage: Number(n & 0x1Fn)
       } 
       else if(type==="food")return{
           id: Number((n >> 23n) & 0xFFFFn),
           amount: Number((n >> 21n) & 0x3n),
           mass: Number((n >> 11n) & 0x3FFn),
           size: Number((n >> 9n) & 0x3n),
           rot: Number((n >> 7n) & 0x3n),
           saturation: Number((n >> 4n) & 0x7n),
           hunger: Number(n & 0x1Fn)
       }
       else if(type==="block")return Block.parse(data)
    }
    static pickup(data,type){
      if(type==="block"&&inventory.every(slot=>slot==null)){
        inventory[0] = { item:data, type:"block" }
        for(let i=1; i<inventory.length; i++){
          inventory[i] = { item:null, type:"locked" }
        }
        updateHotbar()
        return true
      } 
      
      else if(type==="tool"){
         for(let i=0; i<inventory.length; i+=4){
           if(inventory[i]||inventory[i+1]||inventory[i+2]||inventory[i+3])continue
           inventory[i] = { item:data, type:"tool" }
           inventory.fill({ item: null, type: "locked" }, i+1, i+4)
           updateHotbar()
           return true
         }
      }
      
      else if(type==="item"){
        const parsed=Item.parse(data,type)
        const maxStack=parsed.size===0?3:parsed.size===1?1:0
        const slotsOccup=2**parsed.size
        for(let i=0; i<inventory.length; i+=slotsOccup){
          const slot=inventory[i]
          let add=parsed.amount
          if(slot){
            if(slot.type!=="item")continue
            
            const slotItem=Item.parse(slot.item,"item")
            if(slotItem.id!==parsed.id)continue
            if(slotItem.rot!==parsed.rot)continue
            
            add+=slotItem.amount
            if(add>maxStack)continue
          }
          
          let hasSpace=true
          for(let j=i+1; j<slotsOccup+i; j++){
            if(inventory[j]!==null){
              hasSpace=false
              break
            }
          }
          if(!hasSpace)continue
          
          inventory[i]={ item:Item.unparse({ ...parsed, amount:add }, "item"), type:"item" }
          for(let j=i+1; j<slotsOccup+i; j++){
            inventory[j]={ item:null, type:"locked" }
          }
          updateHotbar()
          return true
        }
      }
      
      return false
    }
    constructor(world,pos,mesh,type,data,options={}){
        super(pos,{ mesh, ...options })
        this.type=type
        this.data=data
        this.amount=options.amount??0
        this.time=0
        this.important=false
        
        this.world=world
    }
   
    update(delta=1){
       this.updatePrev()
       this.move(delta)
       this.collide(Item.dims,{ ignorePlayer:true })
       
       this.time+=delta
       
       const dx=player.pos.x-this.pos.x
       const dy=player.pos.y-this.pos.y
       const dz=player.pos.z-this.pos.z
       
       const dist=dx**2+dy**2+dz**2
       const maxDist=(renderDistance*blockSize*3)**2
       
       if(this.time>=300||(!this.important&&(this.time>=120||dist>=maxDist))) this.world.removeElement(this,"items")
       
       const playerCol={
          pos:{ ...player.pos },
          dims:Player.dims,
       }
       const objCol={
         pos:{ ...this.pos },
         dims:{ ...Item.dims },
         vel:{ ...this.vel }
       }
       
       const collision=new Collision(playerCol,objCol)
       if(collision.rect()){
         const pickup=Item.pickup(this.data,this.type)
         if(pickup) this.world.removeElement(this,"items")
       }
       
       if(this.type==="block")this.mesh.rotation.y+=0.5*delta
       else this.mesh.quaternion.copy(camera.quaternion)
    }
}

function createHand(slots, offset) {
    const handDiv = document.createElement("div")
    handDiv.className = "hand"

    slots.forEach((slot, i) => {
      if (!slot || slot.type === "locked" || slot.item === null) return

      const div = document.createElement("div")
      div.className = "slot"

      if (selectedSlot === i + offset) {
        div.classList.add("selected")
      }

      div.innerText = Item.parse(slot.item,"item")?.id ?? Block.parse(slot.item).id
      const item = slot.item
      const type = slot.type
      if(type === "block") div.innerText = Block.parse(item)?.id
      else if(type === "tool") div.innerText = Item.parse(item,"item",type)?.id
      else if(type === "food") div.innerText = Item.parse(item,"item",type)?.id
      else div.innerText = `${Item.parse(item,"item")?.id} (${Item.parse(item,"item")?.amount + 1})`

      div.onclick = () => {
        selectedSlot = i + offset
        updateHotbar()
      }

      handDiv.appendChild(div)
    })

    return handDiv.children.length > 0 ? handDiv : null
  }

function updateHotbar() {
  hotbar.innerHTML = ""

  const left = inventory.slice(0, 4)
  const right = inventory.slice(4, 8)

  const hasLeft = left.some(s => s && s.item !== null)
  const hasRight = right.some(s => s && s.item !== null)

  if (hasLeft) {
    const hand = createHand(left, 0)
    if (hand) hotbar.appendChild(hand)
  }

  if (hasRight) {
    const hand = createHand(right, 4)
    if (hand) hotbar.appendChild(hand)
  }
}

class Chunk{
    static get(pos){
      return (pos.x>>4)+","+(pos.z>>4)
    }
    
    static refresh(key,pos){
       const meshKey=key+","+(pos.x&15) +","+(pos.y&15)+","+(pos.z&15)
       meshQueue.add(meshKey)
    }
    
    static unload(px,pz){
      for(const key of chunks.keys()){
        const [cx,cz]=key.split(",")
        if(Math.abs(cx-px)>loadRadius||Math.abs(cz-pz)>loadRadius)
          unloadQueue.add(key)
      }
    }
    
    static scanNearby(px,pz){
      for(let x=-renderChunks; x<=renderChunks; x++){
        for(let z=-renderChunks; z<=renderChunks; z++){
          const cx=px+x
          const cz=pz+z
          const key=cx+","+cz
          if(chunks.has(key)&&!chunkMeshes.has(key)&&!meshQueue.has(key))meshQueue.add(key)
          else if(!chunkQueue.some(c=>c.cx===cx&&c.cz===cz)){
             chunkQueue.push({cx,cz,dist:Math.abs(x)+Math.abs(z)})
          }
        }
      }
      if(!generatingChunk)chunkQueue.sort((a, b) =>a.dist-b.dist)
      blocksGroup.children.forEach(obj=>{
        if(!obj.userData?.bounds)return
        tempBox.copy(obj.userData.bounds).applyMatrix4(obj.matrixWorld)
        obj.visible=frustum.intersectsBox(tempBox)
      })
    }
    
    constructor(){}
}

function processQueues(){
  if(unloadQueue.size>0){
    let i=0
    for(const key of unloadQueue){
      if(i++>=chunksPerFrame)break
      const mesh=chunkMeshes.get(key)

      if(mesh){
        blocksGroup.remove(mesh)
        mesh.dispose?.()
      }

      chunks.delete(key)
      chunkMeshes.delete(key)
      unloadQueue.delete(key)
    }
  }
  
  if(chunkQueue.length>0&&!generatingChunk){
    while(chunkQueue.length>0){
      let task=chunkQueue[0]
      if(!task)continue
      
      const key=task.cx+","+task.cz
      const pcx=Math.floor(player?.pos.x/blockSize)>>4
      const pcz=Math.floor(player?.pos.z/blockSize)>>4
      const dist=Math.abs(task.cx-pcx)+Math.abs(task.cz-pcz)
      if(dist>renderChunks||unloadQueue.has(key)||chunks.has(key)){
        chunkQueue.shift()
        continue
      }
      
      chunkWorker.postMessage({
        quest:"generate",
        data:{
         cx:task.cx, cz:task.cz,
         pending:nChunk.get(key)
       }
     })
     generatingChunk=true
     break
    }
  }

  if(meshQueue.size>0&&!meshingChunk){
    while(meshQueue.size>0){
      let task=meshQueue.values().next().value
      if(!task)continue
      const [cx,cz,x,y,z]=task.split(",").map(Number)
      
      const pcx=Math.floor(player?.pos.x/blockSize)>>4
      const pcz=Math.floor(player?.pos.z/blockSize)>>4
      const chunk=chunks.get(task)
      const dist=Math.abs(cx-pcx)+Math.abs(cz-pcz)
      if(dist>renderChunks||unloadQueue.has(task)||!chunk){
        meshQueue.delete(task)
        continue
      }
      
      const oldMesh=chunkMeshes.get(task)
      if(oldMesh){
        blocksGroup.remove(oldMesh)
        oldMesh.dispose?.()
      }
      if(x!=undefined&&y!=undefined&&z!=undefined){
       meshWorker.postMessage({
          quest:"refresh",
          data:{
            chunk,
            cx,
            cz,
            x,
            y,
            z,
            oldMesh
          }
       })
       meshingChunk=true
       break
      }
      meshWorker.postMessage({
        quest:"mesh",
        data:{
         chunk,
         cx,
         cz
       }
     })
     meshingChunk=true
     break
    }
  }
}
chunkWorker.onmessage=(event)=>{
  try{
    chunkQueue.shift()
    generatingChunk=false
    const ev=event.data
    chunks.set(ev.key,ev.res)
    meshQueue.add(ev.key)
    if(ev.pend.size>0)for(const [key,pending] of ev.pend){
     const pendChunk=chunks.get(key)
     if(pendChunk)for(const [i,block] of pending)pendChunk.blocks[i]=block
     else{
       const pendNChunk=nChunk.get(key)
       if(pendNChunk)for(const [i,block] of pending)pendNChunk.set(i,block)
       else{
         const blockMap=new Map
         for(const [i,block] of pending)blockMap.set(i,block)
         nChunk.set(key,blockMap)
       }
     }
  }
 } catch(e){
   console.error("[GENERATING THREAD] -",e.message)
 }
}

meshWorker.onmessage=(event)=>{
  try{
    meshingChunk=false
    const ev=event.data
    const res=ev?.result
    if(!ev){
      meshQueue.delete(meshQueue.values().next().value)
      return
    }
    const key=ev.cx+","+ev.cz
    meshQueue.delete(key)
    if(!res||!res.positions?.length){
        chunkMeshes.set(key,null)
        return
    }
    const geometry=new THREE.BufferGeometry()
    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(res.positions,3)
    )
    geometry.setAttribute(
        "normal",
        new THREE.BufferAttribute(res.normals,3)
    )
    geometry.setAttribute(
        "uv",
        new THREE.BufferAttribute(res.uvs,2)
    )
    geometry.setIndex(
        new THREE.BufferAttribute(res.indices,1)
    )
    for(const group of res.groups){
        geometry.addGroup(
            group.start,
            group.count,
            group.materialIndex
        )
    }
    geometry.computeBoundingBox()
    geometry.computeBoundingSphere()
    const mesh=new THREE.Mesh(
        geometry,
        materialList
    )
    mesh.position.set(
        ev.cx*16*blockSize,
        0,
        ev.cz*16*blockSize
    )
    mesh.castShadow=true
    mesh.receiveShadow=true
    const newMesh=new THREE.Group()
    newMesh.add(mesh)
    newMesh.userData.bounds=new THREE.Box3(
        new THREE.Vector3(
            ev.cx*16*blockSize,
            0,
            ev.cz*16*blockSize
        ),
        new THREE.Vector3(
            (ev.cx*16+16)*blockSize,
            worldHeight*blockSize,
            (ev.cz*16+16)*blockSize
        )
    )
    blocksGroup.add(newMesh)
    chunkMeshes.set(key,newMesh)
  } catch(e){
   console.error("[MESH THREAD] -",e.message)
 }
}

class Collision {
    constructor(a,b,options={}){
       this.minA={ x:a.pos.x-a.dims.w/2, y:a.pos.y-a.dims.h/2, z:a.pos.z-a.dims.d/2 }
       this.maxA={ x:a.pos.x+a.dims.w/2, y:a.pos.y+a.dims.h/2, z:a.pos.z+a.dims.d/2 }
       
       this.minB={ x:b.pos.x-b.dims.w/2, y:b.pos.y-b.dims.h/2, z:b.pos.z-b.dims.d/2 }
       this.maxB={ x:b.pos.x+b.dims.w/2, y:b.pos.y+b.dims.h/2, z:b.pos.z+b.dims.d/2 }
       
       this.minBPrev={ ...this.minB }
       this.maxBPrev={ ...this.maxB }
       if(b.prev){
          this.minBPrev={ x:b.prev.x-b.dims.w/2, y:b.prev.y-b.dims.h/2, z:b.prev.z-b.dims.d/2 }
          this.maxBPrev={ x:b.prev.x+b.dims.w/2, y:b.prev.y+b.dims.h/2, z:b.prev.z+b.dims.d/2 }
       }
       
       this.bDimsAxis={ x:b.dims.w, y:b.dims.h, z:b.dims.d }
       
       this.elasticity=options.elasticity??0
       this.disable={
         x:{
           pos:options.disable?.sides??options.disable?.east??false,
           neg:options.disable?.sides??options.disable?.west??false,
         },
         y:{
           pos:options.disable?.up??false,
           neg:options.disable?.down??false,
         },
         z:{
           pos:options.disable?.sides??options.disable?.north??false,
           neg:options.disable?.sides??options.disable?.south??false,
         }
       }
       
       this.result={
          pos:{},
          vel:{ ...b.vel },
          ground:false,
          sucess:false
       }
    }
    rect(){
      return (
        this.minA.x<=this.maxB.x &&
        this.maxA.x>=this.minB.x &&
        
        this.minA.y<=this.maxB.y &&
        this.maxA.y>=this.minB.y &&
        
        this.minA.z<=this.maxB.z &&
        this.maxA.z>=this.minB.z
      )
    }

    resolve(axis){
        if(!this.disable[axis]?.neg&&this.maxBPrev[axis]<=this.minA[axis]&&this.maxB[axis]>=this.minA[axis]){
          this.result.pos[axis]=this.minA[axis]-this.bDimsAxis[axis]/2
          this.result.vel[axis]*=-this.elasticity
          this.result.sucess=true
        } else if(!this.disable[axis]?.pos&&this.minBPrev[axis]>=this.maxA[axis]&&this.minB[axis]<=this.maxA[axis]){
          this.result.pos[axis]=this.maxA[axis]+this.bDimsAxis[axis]/2
          this.result.vel[axis]*=-this.elasticity
          if(axis==="y")this.result.ground=true
          this.result.sucess=true
        }
    }

    collision(axis=null){
      if(!this.rect())return
      
      if(axis){
        this.resolve(axis)
        return this.result
      }
      
      const overlapX=Math.min(this.maxA.x-this.minB.x,this.maxB.x-this.minA.x)
      const overlapY=Math.min(this.maxA.y-this.minB.y,this.maxB.y-this.minA.y)
      const overlapZ=Math.min(this.maxA.z-this.minB.z,this.maxB.z-this.minA.z)

      const overlaps=[
         { axis:'x', value:overlapX },
         { axis:'y', value:overlapY },
         { axis:'z', value:overlapZ }
      ]

      overlaps.sort((a,b)=>a.value-b.value)
      
      for(let i=0;i<3;i++){
        this.resolve(overlaps[i].axis)
      }

      return this.result
   }
}

const blockLootTables={
  "1":[
    { id:1, type:"block", weight: 1 }
  ],
  "3":[
    { id:3, type:"block", weight: 1 }
  ],
  "4":[
    { id:1, type:"item", weight: 1 }
  ],
  "6":[
    { id:1, type:"item", weight: 1 }
  ]
}

for(const block in blockLootTables){
  const loot=blockLootTables[block]
  for(let i=0;i<loot.length;i++){
    const entry=loot[i]
    const { weight,type,...data }=entry
    loot[i]={ weight,type,raw:Item.unparse(data,type) }
  }
}

function getLoot(key){
  const loot=blockLootTables[key]
  if(!loot)return null

  const total=loot.reduce((a,b)=>a+b.weight,0)
  let rand=Math.random()*total

  for(const entry of loot){
    rand-=entry.weight
    if(rand<=0){
      return {
        data:entry.raw,
        type:entry.type
      }
    }
  }

  const entry=loot[loot.length-1]
  return {
    data:entry.raw,
    type:entry.type
  }
}

const instableBlocks=new Set()
class BlockInteractions{
  static destroy(world,pos,block,options={}){
    const json=Block.getJson(block,{pos,parsed:true})
    if(!json)return
    const breakBehavior=json.behavior.breaking
    
    if(!breakingBlock||breakingBlock.x!==pos.x||breakingBlock.y!==pos.y||breakingBlock.z!==pos.z){
      breakingBlock=pos
      breakStartTime=performance.now()
    }
    
    const elapsed=performance.now()-breakStartTime
    if(elapsed>=(breakBehavior?.duration??500)){
      Block.set(pos,0n)
      Chunk.refresh((pos.x>>4)+","+(pos.z>>4),pos)
    } else return
    
    const item=getLoot(String(block.id))
    if(item)world.createItem(pos,item.type,item.data,{ vx:sort(-2,2), vz:sort(-2,2), vy:sort(0,3) })
    
    BlockInteractions.propagateInstability(pos)
    const bellow = Block.parse(Block.get({ x:pos.x,y:pos.y-1,z:pos.z }))
     if(bellow?.id===2&&bellow?.texture===1) Block.set({ x:pos.x, y:pos.y-1, z:pos.z },Block.unparse({id:2}))
  }
  
  static build(world,pos,face){
    const placePos={ x:pos.x+face?.x??0, y:pos.y+face?.y??0, z:pos.z+face?.z??0 }
    const playerPos={ ...world.player.pos }
    for(const axis in playerPos)playerPos[axis]=Math.floor(playerPos[axis]/blockSize)
    
    if(Block.get(placePos))return
    if(playerPos.x===placePos.x&&playerPos.y===placePos.y&&playerPos.z===placePos.z)return
    
    const block=inventory[0]?.type==="block"?inventory[0].item:null
    if(!block)return
    
    Block.set(placePos,block)
    instableBlocks.add(`${placePos.x},${placePos.y},${placePos.z}`)
    Chunk.refresh((placePos.x>>4)+","+(placePos.z>>4),placePos)
    inventory.fill(null)
    updateHotbar()
  }
  
  static propagateInstability(pos){
    instableBlocks.add(`${pos.x+1},${pos.y},${pos.z}`)
    instableBlocks.add(`${pos.x-1},${pos.y},${pos.z}`)
    instableBlocks.add(`${pos.x},${pos.y+1},${pos.z}`)
    instableBlocks.add(`${pos.x},${pos.y-1},${pos.z}`)
    instableBlocks.add(`${pos.x},${pos.y},${pos.z+1}`)
    instableBlocks.add(`${pos.x},${pos.y},${pos.z-1}`)
  }
  
  static collapse(world,pos,key=null){
    BlockInteractions.propagateInstability(pos)
    world.createCollapsedBlock(pos,Block.get(pos))
    Block.set(pos,0n)
    if(key)instableBlocks.remove(key)
    Chunk.refresh((pos.x>>4)+","+(pos.z>>4),pos)
  }
  
  constructor(){}
}

let gameTime = 0
let daytime = 0.5
let daylight = 0
let dayAngle = 0

let breakingBlock = null
let breakStartTime = 0

function update(delta=1) {
  gameTime+=delta
  daytime+=delta/1440
  if (daytime > 1) daytime = 0

  let t = (daytime - 0.2083) % 1
  if (t < 0) t += 1

  dayAngle = t * Math.PI * 2
  daylight = Math.max(0, Math.sin(dayAngle))
  
  sun.intensity = daylight
  ambient.intensity = 0.05 + daylight * 0.25
  
  sun.position.set(
     Math.cos(dayAngle) * 300,
     Math.sin(dayAngle) * 300,
     0
  )
  
   sky.position.set(player.x, player.y, player.z)
   
   sunSprite.position.set(
     player.x + Math.cos(dayAngle) * skyDist,
     player.y + Math.sin(dayAngle) * skyDist,
     player.z
   )

   moonSprite.position.set(
     player.x + Math.cos(dayAngle + Math.PI) * skyDist,
     player.y + Math.sin(dayAngle + Math.PI) * skyDist,
     player.z
   )
   
   lWorld.update(delta)
}

function smoothSkyColor(t) {
  return t * t * (3 - 2 * t)
}

function getSkyColor(daytime) {
  let tDay = daytime % 1
  
  if (tDay < 0.2083) {
    skyColor.copy(nightColor)

  } else if (tDay < 0.2292) {
    let t = (tDay - 0.2083) / (0.2292 - 0.2083)
    t = smoothSkyColor(t)
    skyColor.copy(nightColor).lerp(dawnColor, t)

  } else if (tDay < 0.25) {
    let t = (tDay - 0.2292) / (0.25 - 0.2292)
    t = smoothSkyColor(t)
    skyColor.copy(dawnColor).lerp(dayColor, t)

  } else if (tDay < 0.6667) {
    skyColor.copy(dayColor)

  } else if (tDay < 0.7083) {
    let t = (tDay - 0.6667) / (0.7083 - 0.6667)
    t = smoothSkyColor(t)
    skyColor.copy(dayColor).lerp(sunsetColor, t)

  } else if (tDay < 0.75) {
    let t = (tDay - 0.7083) / (0.75 - 0.7083)
    t = smoothSkyColor(t)
    skyColor.copy(sunsetColor).lerp(nightColor, t)

  } else {
    skyColor.copy(nightColor)
  }

  return skyColor
}

  const sunColor = skyCol.clone()

  sun.color.copy(sunColor)

    camera.projectionMatrix,

  )

  composer.render()
}
